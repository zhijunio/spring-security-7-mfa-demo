<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spring Security MFA 演示</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><p class="eyebrow">SPRING BOOT 4 · SPRING SECURITY 7</p><h1>两步认证演示</h1><p>主认证完成后，先验证一个已配置因子，之后才可访问用户资源。</p></header><section class="card"><h2>第一步 · 主认证</h2><form id="login"><label>用户名<input name="username" value="demo" autocomplete="username"></label><label>密码<input name="password" type="password" value="changeit" autocomplete="current-password"></label><button>密码登录</button></form><button id="passkeyLogin" class="secondary">使用 Passkey 登录</button><p id="sessionState">尚未认证</p></section><section class="card"><h2>第二步 · MFA challenge</h2><div class="row"><button id="sendEmail">发送邮件验证码</button><input id="emailCode" placeholder="6 位邮件验证码"><button id="verifyEmail">验证邮件码</button></div><div class="row"><input id="totpCode" placeholder="TOTP 验证码"><button id="verifyTotp">验证 TOTP</button></div><div class="row"><button id="walletChallenge">获取钱包签名挑战</button><button id="walletVerify">签名并验证</button></div><div class="row"><input id="bip39MfaMnemonic" placeholder="应用生成的 12 词助记词"><button id="verifyBip39Mfa">验证助记词</button></div></section><section class="card"><h2>近期 MFA · 安全设置</h2><p>因子注册、替换和安全设置读取要求最近 5 分钟内验证过 MFA。</p><div class="row"><button id="enrollTotp">开始 TOTP enrollment</button><input id="confirmTotpCode" placeholder="确认验证码"><button id="confirmTotp">确认 TOTP</button></div><pre id="totpInfo"></pre><div class="row"><button id="enrollPasskey">注册 Passkey</button><button id="enrollWallet">绑定当前钱包</button><button id="enrollBip39Mfa">生成 BIP-39 助记词</button></div><pre id="enrollmentResult"></pre></section><section class="card"><h2>普通用户 API</h2><button id="loadProfile">读取 /api/me</button><pre id="profile"></pre><form action="/logout" method="post" id="logout"><button class="secondary">登出</button></form></section><p id="notice" role="status"></p></main><script src="/app.js"></script></body></html>
